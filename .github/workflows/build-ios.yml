name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: false
        default: preview
        type: choice
        options:
          - preview
          - production
          - development
  push:
    tags:
      - 'v*'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS build
        id: build
        run: |
          eas build --platform ios \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --non-interactive \
            --no-wait

      - name: Wait for build
        id: wait
        run: |
          eas build:view ${{ steps.build.outputs.buildId }} --json > build.json
          cat build.json

      - name: Upload IPA to artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: habitokr-ios
          path: build.json
          if-no-files-found: warn
