name: Build unsigned IPA (for Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-ios-unsigned.yml'

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 = Xcode 16 (stable, compatible with Expo SDK 58)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Ruby / Bundler / CocoaPods
        run: |
          sudo gem install bundler --no-document
          brew install cocoapods || gem install cocoapods
          pod setup --verbose || true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: cd ios && pod install --repo-update

      - name: Build unsigned IPA
        run: |
          set -e
          SCHEME="HabitOKR"
          CONFIG="Release"
          BUILD_DIR="$PWD/build"
          ARCHIVE_PATH="$BUILD_DIR/HabitOKR.xcarchive"
          IPA_PATH="$BUILD_DIR/HabitOKR.ipa"
          APP_PATH="$BUILD_DIR/HabitOKR.app"

          mkdir -p "$BUILD_DIR"

          # Let Xcode sign with whatever local identity it can find — the goal
          # here is just to get a clean archive. We strip the signature right
          # after so Sideloadly can re-sign it with the user's Apple ID.
          xcodebuild archive \
            -workspace ios/HabitOKR.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS'

          # Extract the .app bundle
          cp -R "$ARCHIVE_PATH/Products/Applications/$SCHEME.app" "$APP_PATH"

          # Strip ALL code signatures (Mach-O + embedded entitlements)
          codesign --remove-signature "$APP_PATH" || true
          # Also remove extended attributes that can trip Sideloadly
          xattr -cr "$APP_PATH" || true

          # Wrap into IPA — just a zip with .app inside a Payload/ folder
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -r -q "$IPA_PATH" Payload
          ls -lh "$IPA_PATH"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: habitokr-unsigned-ipa
          path: build/HabitOKR.ipa
          if-no-files-found: error
          retention-days: 30
