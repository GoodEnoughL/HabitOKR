name: Build unsigned IPA (for Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-ios-unsigned.yml'

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 = Xcode 16 (stable, compatible with Expo SDK 58 / RN 0.88)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          set -e
          echo "=== Disk before cleanup ==="
          df -h / | grep -E "(Filesystem|/dev/disk)"
          echo ""
          # SAFE cleanup — ONLY remove caches and DerivedData, never touch
          # CoreSimulator or Xcode platforms (they contain iphoneos device SDKs
          # that xcodebuild archive needs to find valid destinations).
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          sudo rm -rf ~/Library/Developer/Xcode/Archives || true
          sudo rm -rf ~/Library/Caches/com.apple.dt.Xcode || true
          sudo rm -rf ~/Library/Caches/org.cocoapods.CocoaPods || true
          brew cleanup --prune=all || true
          echo "=== Disk after cleanup ==="
          df -h / | grep -E "(Filesystem|/dev/disk)"

      - name: Install iOS device platform
        run: |
          # Ensure the iPhoneOS platform SDK is present so xcodebuild archive
          # can find a valid destination for the device build.
          # If already installed this is a no-op.
          xcodebuild -downloadPlatform iOS 2>&1 || true
          echo "=== Platforms available ==="
          ls /Applications/Xcode_*/Contents/Developer/Platforms/ 2>/dev/null || echo "Xcode not found at default path"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Ruby / Bundler / CocoaPods
        run: |
          sudo gem install bundler --no-document
          brew install cocoapods || gem install cocoapods

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: cd ios && pod install --repo-update

      - name: Patch main target to skip signing
        run: |
          # Precisely patch ONLY the HabitOKR main target's buildSettings to
          # skip signing. We MUST NOT pass CODE_SIGNING_ALLOWED=NO globally
          # because Pods script phases (ExpoModulesJSI, etc.) internally need
          # signing for their embedded xcframeworks. Using the xcodeproj gem
          # gives us surgical control over just the main target.
          gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/HabitOKR.xcodeproj")
            target = proj.targets.find { |t| t.name == "HabitOKR" }
            raise "HabitOKR target not found" unless target
            target.build_configurations.each do |config|
              config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
              config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
              config.build_settings["CODE_SIGN_IDENTITY"] = ""
              config.build_settings["DEVELOPMENT_TEAM"] = "XXXXXXXXXX"
              config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ""
              config.build_settings["CODE_SIGN_STYLE"] = "Manual"
            end
            proj.save
            puts "Patched HabitOKR target: signing disabled"
          '
          echo "=== Verifying main target buildSettings ==="
          grep -A 2 "CODE_SIGNING_ALLOWED" ios/HabitOKR.xcodeproj/project.pbxproj | head -20

      - name: Build + archive (let runner sign normally, strip later)
        run: |
          set -e
          SCHEME="HabitOKR"
          ROOT="$PWD"
          BUILD_DIR="$ROOT/build"
          ARCHIVE_PATH="$BUILD_DIR/HabitOKR.xcarchive"
          IPA_PATH="$BUILD_DIR/HabitOKR.ipa"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          echo "=== Disk before archive ==="
          df -h / | grep -E "(Filesystem|/dev/disk)"

          # No global signing flags — main target's buildSettings were patched
          # above (CODE_SIGNING_ALLOWED=NO, etc.) so it skips signing, while Pods
          # targets keep their default signing behavior (their script phases
          # need signing for embedded xcframeworks).
          xcodebuild archive \
            -workspace ios/HabitOKR.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            | tee "$ROOT/xcodebuild.log"
          XCODE_EXIT=${PIPESTATUS[0]}

          if [ $XCODE_EXIT -ne 0 ]; then
            echo ""
            echo "========== BUILD FAILED (exit $XCODE_EXIT) =========="
            echo "=== error markers ==="
            grep -inE "error:|BUILD FAILED|The following build commands failed" "$ROOT/xcodebuild.log" || true
            echo ""
            echo "=== last 100 lines ==="
            tail -100 "$ROOT/xcodebuild.log"
            exit $XCODE_EXIT
          fi

          echo ""
          echo "=== Archive OK ==="
          ls -la "$ARCHIVE_PATH/Products/Applications/"

          # Extract the .app bundle
          APP_PATH="$BUILD_DIR/HabitOKR.app"
          cp -R "$ARCHIVE_PATH/Products/Applications/$SCHEME.app" "$APP_PATH"

          # Strip ALL signatures and extended attributes so Sideloadly
          # can re-sign with the user's free Apple ID.
          echo "=== Stripping signatures ==="
          codesign --remove-signature "$APP_PATH" || true
          xattr -cr "$APP_PATH" || true

          # Verify strip worked
          codesign --verify --deep --strict "$APP_PATH" 2>&1 || echo "(verify failure expected — unsigned app)"

          # Package into standard IPA (Payload/ zip)
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -r -q "$IPA_PATH" Payload
          ls -lh "$IPA_PATH"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: habitokr-unsigned-ipa
          path: build/HabitOKR.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
