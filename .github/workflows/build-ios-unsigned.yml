name: Build unsigned IPA (for Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-ios-unsigned.yml'

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 = Xcode 16 (stable, compatible with Expo SDK 58)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Ruby / Bundler / CocoaPods
        run: |
          sudo gem install bundler --no-document
          brew install cocoapods || gem install cocoapods
          pod setup --verbose || true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: cd ios && pod install --repo-update

      - name: Build unsigned IPA
        run: |
          set -e
          SCHEME="HabitOKR"
          CONFIG="Release"
          ROOT="$PWD"
          BUILD_DIR="$ROOT/build"
          DERIVED_DATA="$ROOT/DerivedData"
          IPA_PATH="$BUILD_DIR/HabitOKR.ipa"
          APP_PATH="$BUILD_DIR/HabitOKR.app"

          rm -rf "$BUILD_DIR" "$DERIVED_DATA"
          mkdir -p "$BUILD_DIR"

          # IMPORTANT: do NOT pass any CODE_SIGNING overrides to xcodebuild.
          # Pods (especially ExpoModulesJSI) have build-script phases that
          # depend on being able to sign internal products themselves — our
          # global NO-SIGN flags break them. The runner has an ad-hoc signing
          # identity available by default, which is fine for our purposes;
          # we'll strip the signature off AFTER the build completes.
          xcodebuild build \
            -workspace ios/HabitOKR.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            | tee "$BUILD_DIR/xcodebuild.log"

          # Find the compiled .app
          COMPILED_APP="$DERIVED_DATA/Build/Products/Release-iphoneos/$SCHEME.app"
          if [ ! -d "$COMPILED_APP" ]; then
            echo "ERROR: compiled app not found at $COMPILED_APP"
            ls -la "$DERIVED_DATA/Build/Products/" 2>&1 || true
            exit 1
          fi

          echo "Found compiled app: $COMPILED_APP"
          cp -R "$COMPILED_APP" "$APP_PATH"

          # Strip all code signatures and extended attributes so Sideloadly
          # can re-sign with the user's Apple ID
          codesign --remove-signature "$APP_PATH" || true
          xattr -cr "$APP_PATH" || true

          # Wrap into IPA
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -r -q "$IPA_PATH" Payload
          ls -lh "$IPA_PATH"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: habitokr-unsigned-ipa
          path: build/HabitOKR.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
