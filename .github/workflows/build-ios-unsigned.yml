name: Build unsigned IPA (for Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-ios-unsigned.yml'

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Ruby / CocoaPods (conditional)
        run: |
          set -e
          ruby --version || true
          pod --version || true
          if ! command -v pod >/dev/null 2>&1 || ! pod --version | grep -qE '^1\.(1[5-9]|[2-9])'; then
            sudo gem install bundler --no-document || true
            brew install cocoapods || gem install cocoapods
          fi
          pod --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: cd ios && pod install --repo-update

      - name: Free disk space before build
        run: |
          df -h
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Caches/Homebrew
          rm -rf ~/Library/Caches/CocoaPods
          xcrun simctl delete unavailable 2>/dev/null || true
          df -h

      - name: Build unsigned IPA
        run: |
          set -e
          SCHEME="HabitOKR"
          CONFIG="Release"
          ROOT="$PWD"
          BUILD_DIR="$ROOT/build"
          DERIVED="$ROOT/DerivedData"
          LOG="$BUILD_DIR/xcodebuild.log"
          IPA_PATH="$BUILD_DIR/$SCHEME.ipa"

          rm -rf "$BUILD_DIR" "$DERIVED"
          mkdir -p "$BUILD_DIR"

          export NODE_BINARY="$(which node)"
          export PATH="$(dirname "$NODE_BINARY"):$PATH"

          echo "=== Neutralize ExpoModulesJSI in Target Support Files ==="
          for f in "ios/Pods/Target Support Files/ExpoModulesJSI/"*.sh; do
            if [ -f "$f" ]; then
              echo "Neutralizing $f"
              cp "$f" "$f.orig" 2>/dev/null || true
              printf '#!/bin/sh\nexit 0\n' > "$f"
              chmod +x "$f"
            fi
          done

          echo "=== Confirm content ==="
          cat "ios/Pods/Target Support Files/ExpoModulesJSI/"*.sh 2>/dev/null || true

          echo "=== Disk before build ==="
          df -h
          echo "=== Memory before build ==="
          vm_stat || true

          set +e
          xcodebuild build \
            -workspace ios/HabitOKR.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            > "$LOG" 2>&1
          XCODE_EXIT=$?
          set -e

          if [ $XCODE_EXIT -ne 0 ]; then
            echo "=== xcodebuild FAILED, XCODE_EXIT=$XCODE_EXIT ==="
            echo "=== ERROR MARKERS ==="
            grep -n -E "error:|Could not resolve package dependencies|Command PhaseScriptExecution failed|BUILD FAILED|The following build commands failed|requires a development team|No space left|Operation not permitted|sandbox|Killed|Signal|segmentation fault|exit code" "$LOG" | tail -150 || true
            echo "=== LAST 250 LINES ==="
            tail -250 "$LOG"
            echo "=== Disk after failed build ==="
            df -h
            echo "=== DerivedData size ==="
            du -sh "$DERIVED" 2>/dev/null || true
            echo "=== ExpoModulesJSI scripts under DerivedData (if any) ==="
            find "$DERIVED" -name "*ExpoModulesJSI*.sh" 2>/dev/null | head -20 || true
            exit $XCODE_EXIT
          fi

          echo "=== Build OK, locating .app ==="
          APP=$(find "$DERIVED/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            find "$DERIVED/Build/Products" -maxdepth 3 -type d | head -80 || true
            exit 1
          fi
          echo "Found app: $APP"

          APP_PATH="$BUILD_DIR/$SCHEME.app"
          cp -R "$APP" "$APP_PATH"
          codesign --remove-signature "$APP_PATH" || true
          xattr -cr "$APP_PATH" || true

          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -r -q "$IPA_PATH" Payload
          ls -lh "$IPA_PATH"

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: habitokr-unsigned-ipa
          path: build/HabitOKR.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7