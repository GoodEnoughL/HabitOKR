name: Build unsigned IPA (for Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-ios-unsigned.yml'

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 = Xcode 16.4 (stable, compatible with Expo SDK 58 / RN 0.88)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Ruby / Bundler / CocoaPods
        run: |
          sudo gem install bundler --no-document
          brew install cocoapods || gem install cocoapods

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: cd ios && pod install --repo-update

      - name: Verify workspace and scheme
        run: |
          set -e
          echo "=== ios directory contents ==="
          ls -la ios/
          echo ""
          echo "=== List schemes from workspace ==="
          xcodebuild -list -workspace ios/HabitOKR.xcworkspace 2>&1 | head -30
          echo ""
          echo "=== Check workspace exists ==="
          test -d ios/HabitOKR.xcworkspace
          echo "Workspace OK"

      - name: Build unsigned IPA
        run: |
          set -e
          SCHEME="HabitOKR"
          CONFIG="Release"
          ROOT="$PWD"
          BUILD_DIR="$ROOT/build"
          DERIVED_DATA="$ROOT/DerivedData"
          IPA_PATH="$BUILD_DIR/HabitOKR.ipa"

          rm -rf "$BUILD_DIR" "$DERIVED_DATA"
          mkdir -p "$BUILD_DIR"

          # Let xcodebuild use whatever signing identity the runner has
          # by default. We strip signatures OFF after build, not before.
          # -quiet hides the linker "note: Disabling previews" spam so
          # real errors are visible
          xcodebuild build \
            -workspace ios/HabitOKR.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            -quiet

          echo "=== Build finished, listing DerivedData ==="
          ls -la "$DERIVED_DATA/Build/Products/" 2>&1 || true

          # Find the compiled .app
          COMPILED_APP=$(find "$DERIVED_DATA/Build/Products/Release-iphoneos" -name "*.app" -type d | head -1)
          if [ -z "$COMPILED_APP" ]; then
            echo "ERROR: compiled .app bundle not found anywhere"
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 2>&1 | head -30 || true
            exit 1
          fi

          echo "Found compiled app: $COMPILED_APP"
          APP_PATH="$BUILD_DIR/HabitOKR.app"
          cp -R "$COMPILED_APP" "$APP_PATH"

          # Strip all code signatures and extended attributes
          codesign --remove-signature "$APP_PATH" || true
          xattr -cr "$APP_PATH" || true

          # Wrap into IPA (Payload/ folder zip)
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -r -q "$IPA_PATH" Payload
          ls -lh "$IPA_PATH"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: habitokr-unsigned-ipa
          path: build/HabitOKR.ipa
          if-no-files-found: error
          retention-days: 30
