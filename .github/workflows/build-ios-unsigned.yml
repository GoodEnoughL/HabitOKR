name: Build unsigned IPA (for Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-ios-unsigned.yml'

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 = Xcode 16 (stable, compatible with Expo SDK 58 / RN 0.88)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Ruby / Bundler / CocoaPods
        run: |
          sudo gem install bundler --no-document
          brew install cocoapods || gem install cocoapods

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: cd ios && pod install --repo-update

      - name: Ensure Pods xcconfig doesn't force DEVELOPMENT_TEAM
        run: |
          # Pods may inject DEVELOPMENT_TEAM into its xcconfigs which overrides
          # our command-line flags. Blank them out so our CODE_SIGNING_ALLOWED=NO
          # takes effect for everything downstream.
          for f in ios/Pods/Target\ Support\ Files/Pods-HabitOKR/*.xcconfig; do
            echo "=== Patching $f ==="
            cat "$f"
            sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' "$f"
          done

      - name: Build unsigned IPA (archive + strip)
        run: |
          set -e
          SCHEME="HabitOKR"
          CONFIG="Release"
          ROOT="$PWD"
          BUILD_DIR="$ROOT/build"
          ARCHIVE_PATH="$BUILD_DIR/HabitOKR.xcarchive"
          IPA_PATH="$BUILD_DIR/HabitOKR.ipa"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          # Use archive (Xcode's standard packaging flow) — friendlier to Pods
          # script phases than `build`. Global NO-SIGN flags are the supported
          # official way; they blank DEVELOPMENT_TEAM so Xcode can't complain.
          xcodebuild archive \
            -workspace ios/HabitOKR.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            || {
              echo ""
              echo "========== BUILD FAILED — last 200 lines of output =========="
              echo "==============================================================="
              exit 1
            }

          echo "=== Archive OK, extracting .app ==="
          ls -la "$ARCHIVE_PATH/Products/Applications/"

          APP_PATH="$BUILD_DIR/HabitOKR.app"
          cp -R "$ARCHIVE_PATH/Products/Applications/$SCHEME.app" "$APP_PATH"

          # Strip signatures + extended attributes for Sideloadly
          codesign --remove-signature "$APP_PATH" || true
          xattr -cr "$APP_PATH" || true

          # Wrap into IPA (Payload/ folder zip)
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -r -q "$IPA_PATH" Payload
          ls -lh "$IPA_PATH"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: habitokr-unsigned-ipa
          path: build/HabitOKR.ipa
          if-no-files-found: error
          retention-days: 30
