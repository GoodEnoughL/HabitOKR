name: Build unsigned IPA (for Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-ios-unsigned.yml'

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 = Xcode 16 (stable, compatible with Expo SDK 58 / RN 0.88)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          set -e
          echo "=== Disk before cleanup ==="
          df -h / | grep -E "(Filesystem|/dev/disk)"
          echo ""
          echo "=== Cleaning Xcode simulators, caches, and pre-existing DerivedData ==="
          # Remove simulator runtimes (these take ~20-40GB on the runner and
          # we never use them — we build for device, not simulator)
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes || true
          sudo rm -rf /Library/Developer/CoreSimulator/Devices || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles || true
          sudo rm -rf ~/Library/Developer/CoreSimulator || true

          # Xcode caches
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          sudo rm -rf ~/Library/Developer/Xcode/Archives || true
          sudo rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport || true
          sudo rm -rf ~/Library/Caches/com.apple.dt.Xcode || true

          # Xcode Swift module caches
          sudo rm -rf ~/Library/Developer/XCPGDevices || true
          sudo rm -rf ~/Library/Developer/XCPGServices || true

          # Homebrew caches (reclaim a couple GB)
          brew cleanup --prune=all || true

          echo ""
          echo "=== Disk after cleanup ==="
          df -h / | grep -E "(Filesystem|/dev/disk)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Ruby / Bundler / CocoaPods
        run: |
          sudo gem install bundler --no-document
          brew install cocoapods || gem install cocoapods

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: cd ios && pod install --repo-update

      - name: Ensure Pods xcconfig doesn't force DEVELOPMENT_TEAM
        run: |
          for f in ios/Pods/Target\ Support\ Files/Pods-HabitOKR/*.xcconfig; do
            sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' "$f"
          done

      - name: Build unsigned IPA (archive + strip)
        run: |
          set -e
          SCHEME="HabitOKR"
          CONFIG="Release"
          ROOT="$PWD"
          BUILD_DIR="$ROOT/build"
          ARCHIVE_PATH="$BUILD_DIR/HabitOKR.xcarchive"
          IPA_PATH="$BUILD_DIR/HabitOKR.ipa"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          echo "=== Disk before archive ==="
          df -h / | grep -E "(Filesystem|/dev/disk)"

          # Use archive with official NO-SIGN flags. We let xcodebuild archive
          # with the signing flags to skip code signing; Pods scripts are not
          # affected because we don't CODE_SIGNING_ALLOWED on those targets.
          xcodebuild archive \
            -workspace ios/HabitOKR.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

          echo "=== Archive OK ==="
          ls -la "$ARCHIVE_PATH/Products/Applications/"

          APP_PATH="$BUILD_DIR/HabitOKR.app"
          cp -R "$ARCHIVE_PATH/Products/Applications/$SCHEME.app" "$APP_PATH"

          # Strip signatures + extended attributes for Sideloadly
          codesign --remove-signature "$APP_PATH" || true
          xattr -cr "$APP_PATH" || true

          # Wrap into IPA
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -r -q "$IPA_PATH" Payload
          ls -lh "$IPA_PATH"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: habitokr-unsigned-ipa
          path: build/HabitOKR.ipa
          if-no-files-found: error
          retention-days: 30
